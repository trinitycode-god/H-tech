<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — TrinityCode</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="icons/sem-imagem.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- TELA DE LOGIN -->
<div class="tela-login" id="tela-login">
  <div class="card-login">
    <div class="logo-mark" style="margin:0 auto 16px;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#E86A2C,#3B7DDD);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;font-family:'Space Grotesk',sans-serif;">TC</div>
    <h1>Painel Administrativo</h1>
    <p class="sub">Acesso restrito — TrinityCode</p>
    <div class="msg-erro" id="login-erro"></div>
    <form id="form-login">
      <div class="campo">
        <label>Senha de acesso</label>
        <input type="password" id="input-senha" placeholder="••••••••" required autofocus>
      </div>
      <button type="submit" class="btn btn-primario">Entrar</button>
    </form>
  </div>
</div>

<!-- PAINEL -->
<div class="admin-layout oculto" id="painel">
  <aside class="admin-sidebar">
    <div class="logo">
      <span class="logo-mark" style="width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#E86A2C,#3B7DDD);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;">TC</span>
      <span>TrinityCode</span>
    </div>
    <nav class="admin-nav">
      <button data-aba="dashboard" class="ativo">
        <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
        <span>Visão geral</span>
      </button>
      <button data-aba="produtos">
        <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>
        <span>Produtos</span>
      </button>
      <button data-aba="banners">
        <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 15 5-5 4 4 4-4 5 5"/></svg></span>
        <span>Banners</span>
      </button>
      <button data-aba="categorias">
        <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span>
        <span>Categorias</span>
      </button>
      <button data-aba="configuracoes">
        <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span>
        <span>Configurações</span>
      </button>
    </nav>
    <button class="admin-sair" id="btn-sair">
      <span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
      <span>Sair do painel</span>
    </button>
  </aside>

  <div class="admin-conteudo" id="admin-conteudo"></div>
</div>

<!-- MODAL -->
<div class="modal-fundo" id="modal-fundo"></div>

<!-- TOASTS -->
<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
